<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>20230011 · HSK4 Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08060f;
  --panel:rgba(10,8,20,.88);
  --orange:#ff4d00;
  --magenta:#ff2d78;
  --cyan:#00e5ff;
  --violet:#7c4dff;
  --green:#00ff9d;
  --red:#ff3d5a;
  --yellow:#ffd60a;
  --text:#f3f4ff;
  --muted:#a7abc9;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}

body{
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

.hanzi,.hanzi-text,.order-part .txt,.chip .hanzi,.lesson-title,.mode-card .zh,.q-prompt-hanzi,.build-chip,.option-hanzi,.study-word,ruby,.vocab-circle-hanzi,.word-detail-hanzi,.word-detail-example-cn,.mistake-question,.lesson-card-title,.lesson-card-number{
  font-family:"Ma Shan Zheng","Kaiti SC","KaiTi","STKaiti","SimSun",serif !important;
  letter-spacing:.03em;
}

ruby{ruby-position:over}
rt{
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif !important;
  font-size:.5em;font-weight:700;color:#9ff3ff;letter-spacing:0;line-height:1;
}
body.no-pinyin rt{display:none !important}

.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.42;z-index:0;pointer-events:none;mix-blend-mode:screen}
.b1{width:55vmax;height:55vmax;background:radial-gradient(circle,#ff4d00,transparent 60%);top:-20vmax;left:-15vmax;animation:drift1 18s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;background:radial-gradient(circle,#7c4dff,transparent 60%);bottom:-20vmax;right:-15vmax;animation:drift2 22s ease-in-out infinite alternate}
.b3{width:40vmax;height:40vmax;background:radial-gradient(circle,#00e5ff,transparent 60%);top:40%;left:55%;opacity:.25;animation:drift3 20s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vw,-12vh) scale(1.2)}}
@keyframes drift3{to{transform:translate(-14vw,8vh) scale(.85)}}

.hidden{display:none !important}

.screen{
  position:relative;z-index:2;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:98px 20px 40px;
}
.center{justify-content:center}

/* ============ NAME RAIN BACKGROUND ============ */
#nameRain{
  position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
  opacity:.08;
}
.rain-drop{
  position:absolute;
  font-family:"ZCOOL KuaiLe","Ma Shan Zheng",cursive,serif;
  white-space:nowrap;
  user-select:none;
  animation:rainFall linear infinite;
  will-change:transform;
  text-shadow:0 0 8px currentColor;
}
@keyframes rainFall{
  0%{transform:translateY(-100px) rotate(var(--rot,0deg));opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(calc(100vh + 100px)) rotate(var(--rot,0deg));opacity:0}
}

/* ============ INTRO ============ */
#introScreen{overflow:hidden;background:#050308;transition:opacity .8s,transform .8s}
#introScreen.out{opacity:0;transform:scale(1.05);pointer-events:none}

.scanlines{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px);
  mix-blend-mode:overlay;opacity:.35;
}

.intro-grid{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);
  background-size:60px 60px;
  opacity:.4;
}

.digit-row{
  position:relative;z-index:5;display:flex;gap:clamp(4px,1.5vw,12px);
  justify-content:center;align-items:center;min-height:1.3em;
}
.digit{
  font-size:clamp(48px,12vw,120px);font-weight:900;line-height:1;
  background:linear-gradient(180deg,var(--cyan),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(0,229,255,.35));
  opacity:0;
  transform:translateY(-40px) scale(0.95);
  animation:digitSlideIn 2s cubic-bezier(0.16,1,0.3,1) forwards;
  animation-delay:var(--d);
  will-change:transform,opacity;
}
@keyframes digitSlideIn{
  0%{opacity:0;transform:translateY(-40px) scale(0.95)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

.digit.assembled{
  animation:digitGlow 4s ease-in-out infinite;
}
@keyframes digitGlow{
  0%,100%{filter:drop-shadow(0 0 20px rgba(0,229,255,.3))}
  50%{filter:drop-shadow(0 0 35px rgba(124,77,255,.5))}
}

#introSub{
  position:relative;z-index:5;margin-top:32px;
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:clamp(12px,2.2vw,16px);letter-spacing:.4em;color:var(--cyan);
  white-space:nowrap;opacity:0;
  text-shadow:0 0 16px rgba(0,229,255,.5);
  animation:fadeInSubtitle 1.5s ease-out 3.5s forwards;
}
@keyframes fadeInSubtitle{to{opacity:1}}

.intro-skip{position:relative;z-index:5;margin-top:48px;opacity:0;animation:fadeIn 1s ease-out 4.5s forwards}
@keyframes fadeIn{to{opacity:.7}}

.intro-flash{position:absolute;inset:0;z-index:10;background:linear-gradient(180deg,rgba(0,229,255,.08),transparent);opacity:0;pointer-events:none}
.intro-flash.go{animation:elegantFlash 1.5s ease-out}
@keyframes elegantFlash{0%{opacity:0}50%{opacity:1}100%{opacity:0}}

/* ============ 3D LESSON CARDS - SIDE BY SIDE ============ */
.lesson-cards-3d{
  perspective:1200px;
  perspective-origin:50% 50%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  margin:28px 0;
  width:min(900px,100%);
}

.lesson-card-3d{
  position:relative;
  width:100%;
  min-height:240px;
  transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;
}

.lesson-card-3d:nth-child(1){
  animation:card3dFloat1 7s ease-in-out infinite;
}
.lesson-card-3d:nth-child(2){
  animation:card3dFloat2 7s ease-in-out infinite;
  animation-delay:-3.5s;
}

@keyframes card3dFloat1{
  0%,100%{transform:rotateY(-4deg) rotateX(3deg)}
  50%{transform:rotateY(4deg) rotateX(-3deg)}
}
@keyframes card3dFloat2{
  0%,100%{transform:rotateY(4deg) rotateX(-3deg)}
  50%{transform:rotateY(-4deg) rotateX(3deg)}
}

.lesson-card-3d:hover{
  animation-play-state:paused;
  transform:rotateY(-10deg) rotateX(5deg) translateZ(30px) scale(1.03) !important;
}

.lesson-card-face{
  position:relative;
  border-radius:24px;
  padding:28px 26px;
  background:linear-gradient(135deg,rgba(10,8,25,.92),rgba(20,12,38,.92));
  border:1px solid rgba(0,229,255,.2);
  box-shadow:
    0 0 40px rgba(0,229,255,.08),
    0 20px 60px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.06);
  transform-style:preserve-3d;
  overflow:hidden;
  height:100%;
}

.lesson-card-face::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,var(--orange),var(--magenta),var(--violet),var(--cyan));
  border-radius:24px 24px 0 0;
}

.lesson-card-face::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(0,229,255,.03),transparent 50%);
  pointer-events:none;
}

.lesson-card-number{
  font-size:13px;
  font-weight:900;
  color:var(--cyan);
  letter-spacing:.2em;
  margin-bottom:10px;
  text-transform:uppercase;
}

.lesson-card-title{
  font-size:30px;
  line-height:1.3;
  margin-bottom:12px;
  color:var(--text);
}

.lesson-card-sub{
  font-size:14px;
  color:var(--muted);
  line-height:1.5;
  margin-bottom:16px;
}

.lesson-card-chips{
  display:flex;gap:8px;flex-wrap:wrap;
}
.lesson-card-chip{
  padding:6px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  text-align:center;
  min-width:60px;
}
.lesson-card-chip .hanzi{
  font-size:18px;
  display:block;
}
.lesson-card-chip .pinyin{
  font-size:10px;
  color:#9ff3ff;
  display:block;
  margin-top:2px;
}

/* Card side depth effect */
.lesson-card-3d::before{
  content:"";
  position:absolute;
  top:8px;bottom:8px;
  right:-6px;
  width:6px;
  background:linear-gradient(180deg,rgba(0,229,255,.15),rgba(124,77,255,.15));
  border-radius:0 4px 4px 0;
  transform:rotateY(90deg);
  transform-origin:left;
}
.lesson-card-3d::after{
  content:"";
  position:absolute;
  left:8px;right:8px;
  bottom:-6px;
  height:6px;
  background:linear-gradient(90deg,rgba(124,77,255,.15),rgba(0,229,255,.15));
  border-radius:0 0 4px 4px;
  transform:rotateX(-90deg);
  transform-origin:top;
}

/* ============ CIRCULAR VOCABULARY ============ */
.vocab-circle-container{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:32px;margin:32px 0;justify-items:center;
  max-width:900px;
}

.vocab-circle{
  position:relative;width:180px;height:180px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(124,77,255,.12));
  border:2px solid rgba(0,229,255,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(0,229,255,.1),inset 0 0 40px rgba(0,229,255,.05);
  transition:all .5s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;
  animation:circleFloat 6s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * 0.15s);
}

.vocab-circle:nth-child(1){--i:0}
.vocab-circle:nth-child(2){--i:1}
.vocab-circle:nth-child(3){--i:2}
.vocab-circle:nth-child(4){--i:3}
.vocab-circle:nth-child(5){--i:4}
.vocab-circle:nth-child(6){--i:5}
.vocab-circle:nth-child(7){--i:6}
.vocab-circle:nth-child(8){--i:7}
.vocab-circle:nth-child(9){--i:8}
.vocab-circle:nth-child(10){--i:9}

@keyframes circleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.vocab-circle:hover{
  transform:scale(1.1) translateY(-4px);
  border-color:rgba(0,229,255,.7);
  box-shadow:0 0 80px rgba(0,229,255,.3),inset 0 0 60px rgba(0,229,255,.12);
}

.vocab-circle-hanzi{
  font-size:42px;line-height:1;margin-bottom:8px;
}

.vocab-circle-pinyin{
  font-size:14px;color:#9ff3ff;font-weight:600;letter-spacing:.05em;
}

/* ============ WORD DETAIL VIEW ============ */
.word-detail-overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(5,3,10,.92);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.word-detail-overlay.active{opacity:1;pointer-events:auto}

.word-detail-card{
  width:min(640px,90vw);padding:44px 36px;
  border-radius:28px;
  background:linear-gradient(135deg,rgba(10,8,25,.95),rgba(20,10,35,.95));
  border:1px solid rgba(0,229,255,.2);
  box-shadow:0 0 80px rgba(0,229,255,.1);
  text-align:center;
  transform:scale(0.9);
  transition:transform .4s cubic-bezier(0.16,1,0.3,1);
}
.word-detail-overlay.active .word-detail-card{transform:scale(1)}

.word-detail-hanzi{
  font-size:clamp(60px,11vw,88px);
  margin-bottom:14px;
}

.word-detail-pinyin{
  font-size:24px;color:#9ff3ff;font-weight:700;
  margin-bottom:10px;letter-spacing:.1em;
}

.word-detail-meaning{
  font-size:22px;color:var(--yellow);font-weight:800;
  margin-bottom:32px;
}

.word-detail-examples{
  text-align:left;
}

.word-detail-example{
  padding:18px;border-radius:16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:16px;
}

.word-detail-example-label{
  font-size:11px;color:var(--cyan);font-weight:800;
  letter-spacing:.15em;text-transform:uppercase;
  margin-bottom:10px;
}

.word-detail-example-cn{
  font-size:22px;line-height:1.9;margin-bottom:8px;
}

.word-detail-example-en{
  font-size:15px;color:var(--muted);line-height:1.5;
}

.word-detail-back{
  margin-top:28px;
}

/* ============ HUD ============ */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:rgba(5,4,10,.72);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.hud-left,.hud-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud-brand{font-weight:900;color:var(--cyan);letter-spacing:.12em}
.hud-user{color:var(--muted);font-size:14px}
.hud-lesson{color:var(--yellow);font-weight:800;font-size:14px}

.timer-pill{
  min-width:72px;text-align:center;padding:7px 12px;border-radius:999px;
  font-weight:900;color:var(--green);
  border:1px solid rgba(0,255,157,.35);background:rgba(0,255,157,.08);
}
.timer-pill.low{color:var(--red);border-color:rgba(255,61,90,.45);background:rgba(255,61,90,.1);animation:pulse 1s infinite}
.timer-pill.off{color:var(--muted);border-color:rgba(167,171,201,.3);background:rgba(167,171,201,.08)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.toggle{
  border:none;cursor:pointer;border-radius:999px;padding:8px 13px;font-weight:900;
  color:#767b9d;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:.2s;
}
.toggle.on{color:#fff;border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.12);box-shadow:0 0 18px rgba(0,229,255,.15)}

.big-title{
  font-size:clamp(36px,7vw,68px);font-weight:900;text-align:center;
  background:linear-gradient(90deg,var(--orange),var(--magenta),var(--violet),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;
}
.screen-title{font-size:clamp(28px,5vw,44px);font-weight:900;margin-bottom:18px;text-align:center}
.subtle{color:var(--muted);line-height:1.7;text-align:center;max-width:720px}

.btn{
  position:relative;border:none;cursor:pointer;color:#fff;font-weight:900;letter-spacing:.1em;
  padding:15px 32px;font-size:16px;border-radius:999px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--orange),var(--magenta),var(--violet));
  background-size:200% 100%;
  box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 10px 40px rgba(255,45,120,.25);
  transition:transform .2s,box-shadow .2s,background-position .5s;
}
.btn:hover{transform:translateY(-2px) scale(1.03);background-position:100% 0}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.btn.small{padding:11px 20px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important}

input[type=text]{
  width:min(480px,100%);padding:16px 18px;border-radius:16px;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  color:#fff;font-size:18px;outline:none;margin:18px 0;text-align:center;
}

.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.chip{position:relative;padding:8px 11px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);min-width:64px;text-align:center}
.chip .hanzi{font-size:22px;display:block}

.pinyin-helper{display:block;margin-top:4px;color:#9ff3ff;font-size:11px;line-height:1.25}
.english-helper{display:block;margin-top:2px;color:#ffd7ea;font-size:11px;line-height:1.25}
body.no-pinyin .pinyin-helper{display:none !important}
body.no-english .english-helper{display:none !important}

.quiz-top{width:min(820px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.mode-label{font-weight:900;color:var(--cyan);letter-spacing:.08em}
.q-label{color:var(--muted);font-weight:800}

.quiz-card{width:min(820px,100%);border-radius:26px;padding:2px;overflow:hidden;position:relative}
.quiz-card::before{content:"";position:absolute;inset:-160%;background:conic-gradient(var(--orange),var(--magenta),var(--violet),var(--cyan),var(--orange));animation:rotate360 5s linear infinite;opacity:.45}
.quiz-card-inner{position:relative;border-radius:24px;background:var(--panel);backdrop-filter:blur(16px);padding:28px 24px}
@keyframes rotate360{to{transform:rotate(360deg)}}

.q-sub{color:var(--muted);margin:10px 0 18px;line-height:1.6}
.q-prompt-hanzi{font-size:clamp(42px,7vw,64px);line-height:1.2;text-align:center;margin-top:6px}
.q-text{font-size:clamp(20px,3vw,27px);line-height:2.4}
.blank{color:var(--cyan);font-weight:900}
.passage{
  padding:16px;border-radius:16px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  font-size:clamp(18px,2.6vw,23px);line-height:2.5;margin-bottom:14px;
}

.options{display:grid;gap:12px;margin-top:18px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
  padding:14px 16px;border-radius:16px;font-size:16px;font-weight:600;color:#e8eaff;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
}
.opt:hover:not(:disabled){transform:translateX(6px);background:rgba(255,255,255,.1);border-color:rgba(0,229,255,.5);box-shadow:0 0 20px rgba(0,229,255,.15)}
.opt:disabled{cursor:default}
.opt .badge{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:14px;background:linear-gradient(135deg,rgba(255,77,0,.25),rgba(124,77,255,.25));border:1px solid rgba(255,255,255,.15)}
.opt.correct{background:rgba(0,255,157,.14);border-color:var(--green);box-shadow:0 0 24px rgba(0,255,157,.35)}
.opt.wrong{background:rgba(255,61,90,.14);border-color:var(--red);box-shadow:0 0 24px rgba(255,61,90,.35)}
.opt.dim{opacity:.4}
.opt-content{display:flex;flex-direction:column;gap:3px}
.option-hanzi{font-size:24px;line-height:1.9}

.feedback{margin-top:18px;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.25);color:#c9f6ff}
.feedback.good{background:rgba(0,255,157,.08);border-color:rgba(0,255,157,.3)}
.feedback.bad{background:rgba(255,61,90,.08);border-color:rgba(255,61,90,.3)}
.feedback .verdict{font-weight:900;letter-spacing:.1em;margin-bottom:5px}
.feedback.good .verdict{color:var(--green)}
.feedback.bad .verdict{color:var(--red)}

.order-parts{display:grid;gap:12px;margin-top:18px}
.order-part{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);color:var(--text);cursor:pointer;
  font-size:20px;line-height:2.3;transition:.18s;
}
.order-part:hover{background:rgba(255,255,255,.1);border-color:rgba(0,229,255,.4)}
.order-part.selected{background:rgba(124,77,255,.16);border-color:rgba(124,77,255,.55);box-shadow:0 0 20px rgba(124,77,255,.18)}
.order-seq{margin-top:16px;font-size:24px;font-weight:900;letter-spacing:.2em;color:var(--yellow);min-height:34px}

.build-answer{
  min-height:92px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:16px;border-radius:18px;background:rgba(255,255,255,.04);
  border:1px dashed rgba(255,255,255,.18);margin-bottom:16px;
}
.build-placeholder{color:var(--muted);font-size:14px}
.build-bank{display:flex;flex-wrap:wrap;gap:10px}
.build-chip{
  border:none;cursor:pointer;padding:12px 16px;border-radius:14px;
  font-size:26px;line-height:1.6;color:#fff;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);transition:.18s;
}
.build-chip:hover{transform:translateY(-2px);border-color:rgba(0,229,255,.45);box-shadow:0 0 18px rgba(0,229,255,.12)}
.build-chip.placed{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.35)}

.result-stats{width:min(760px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0}
.stat{padding:18px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);text-align:center}
.stat .num{font-size:34px;font-weight:900;color:var(--yellow)}
.stat .label{margin-top:6px;color:var(--muted);font-size:13px}

.mistakes{width:min(760px,100%);margin-top:14px;padding:24px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)}
.mistakes h3{margin-bottom:18px;color:var(--red);font-size:20px}

.mistake-item{
  padding:18px;border-radius:14px;
  background:rgba(255,61,90,.06);
  border:1px solid rgba(255,61,90,.15);
  margin-bottom:14px;
}
.mistake-item:last-child{margin-bottom:0}

.mistake-question{
  font-size:18px;line-height:1.8;margin-bottom:10px;color:var(--text);
}

.mistake-question-en{
  font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:12px;
  font-style:italic;
}

.mistake-answers{
  display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;
  font-size:14px;
}
.mistake-your-answer{color:var(--red);font-weight:700}
.mistake-correct-answer{color:var(--green);font-weight:700}

.mistake-explanation{
  font-size:13px;color:var(--muted);line-height:1.6;
  padding-top:12px;border-top:1px solid rgba(255,255,255,.06);
}

.mistake-mode-label{
  font-size:11px;color:var(--cyan);font-weight:800;
  letter-spacing:.15em;text-transform:uppercase;
  margin-bottom:10px;
}

/* ============ DUAL LEADERBOARDS ============ */
.lb-dual{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  width:min(900px,100%);
  margin-top:28px;
}

.lb-panel{
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);
}

.lb-panel h3{
  margin-bottom:14px;
  color:var(--cyan);
  font-size:16px;
  letter-spacing:.05em;
}

.lb-row{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:8px;font-size:14px;
}
.lb-row.me{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.45);box-shadow:0 0 18px rgba(0,229,255,.15)}
.lb-rank{width:36px;font-weight:900;color:var(--yellow);font-size:14px}
.lb-name{flex:1;font-weight:700}
.lb-score{font-weight:900;color:var(--green);font-size:14px}
.lb-acc{width:44px;text-align:right;color:var(--muted);font-size:13px}
.lb-note{color:var(--muted);font-size:12px;margin-top:8px}

.trans-big{
  font-size:clamp(38px,7vw,70px);font-weight:900;text-align:center;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.timer-toggle-container{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;border-radius:16px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  margin:16px auto;max-width:360px;
}
.timer-toggle-label{font-size:14px;font-weight:700;color:var(--text)}
.timer-toggle-switch{
  position:relative;width:52px;height:28px;
  background:rgba(255,255,255,.1);border-radius:14px;
  cursor:pointer;transition:background .3s;
  border:1px solid rgba(255,255,255,.15);
}
.timer-toggle-switch.on{background:rgba(0,229,255,.25);border-color:rgba(0,229,255,.5)}
.timer-toggle-switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .3s;
}
.timer-toggle-switch.on::after{transform:translateX(24px)}

@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}

@media (max-width:700px){
  .lb-dual{grid-template-columns:1fr}
  .lesson-cards-3d{grid-template-columns:1fr}
  .screen{padding-top:112px}
  .quiz-card-inner{padding:22px 16px}

  .vocab-circle{width:140px;height:140px}
  .vocab-circle-hanzi{font-size:34px}
  .vocab-circle-container{gap:20px}
  .lesson-card-3d:hover{transform:rotateY(-4deg) rotateX(2deg) translateZ(10px) !important}
}

/* ============ NAME RAIN SYSTEM ============ */
const RAIN_COLORS = ['#00e5ff','#ff2d78','#7c4dff','#00ff9d','#ffd60a','#ff4d00','#ff6ec7','#4deeea','#b967ff','#39ff14'];
let rainInterval = null;
let rainDrops = [];

function startNameRain(name){
  stopNameRain();
  if(!name) return;
  const container = $('nameRain');
  container.innerHTML = '';
  rainDrops = [];
  
  for(let i = 0; i < 20; i++){
    createRainDrop(name, container, true);
  }
  
  rainInterval = setInterval(() => {
    if(rainDrops.length < 25){
      createRainDrop(name, container, false);
    }
  }, 500);
}

function createRainDrop(name, container, stagger){
  const drop = document.createElement('div');
  drop.className = 'rain-drop';
  drop.textContent = name;
  
  const x = Math.random() * 100;
  const duration = 5 + Math.random() * 10;
  const delay = stagger ? Math.random() * 12 : 0;
  const size = 16 + Math.random() * 28;
  const rot = (Math.random() - 0.5) * 40;
  const opacity = 0.4 + Math.random() * 0.6;
  const color = RAIN_COLORS[Math.floor(Math.random() * RAIN_COLORS.length)];
  
  drop.style.left = x + '%';
  drop.style.fontSize = size + 'px';
  drop.style.color = color;
  drop.style.animationDuration = duration + 's';
  drop.style.animationDelay = delay + 's';
  drop.style.setProperty('--rot', rot + 'deg');
  drop.style.opacity = opacity;
  
  container.appendChild(drop);
  rainDrops.push(drop);
  
  setTimeout(() => {
    if(drop.parentNode){
      drop.parentNode.removeChild(drop);
      const idx = rainDrops.indexOf(drop);
      if(idx > -1) rainDrops.splice(idx, 1);
      if(S.userEntered && S.userName){
        createRainDrop(S.userName, container, false);
      }
    }
  }, (duration + delay) * 1000);
}

function stopNameRain(){
  if(rainInterval){
    clearInterval(rainInterval);
    rainInterval = null;
  }
  const container = $('nameRain');
  if(container) container.innerHTML = '';
  rainDrops = [];
}

function loadLB(){
  try{ return JSON.parse(localStorage.getItem('hsk_lb') || '[]'); }catch(e){ return []; }
}

function lbRowHTML(e, rank, isMe){
  return `
    <div class="lb-row${isMe ? ' me' : ''}">
      <span class="lb-rank">#${rank}</span>
      <span class="lb-name">${e.n}</span>
      <span class="lb-score">${e.s}/${e.t}</span>
      <span class="lb-acc">${e.a}%</span>
    </div>
  `;
}

function recordScore(){
  const acc = S.total ? Math.round((S.correct / S.total) * 100) : 0;
  const entry = {n:S.userName, s:S.correct, t:S.total, a:acc, l:S.lesson.id, d:Date.now()};
  let lb = loadLB();
  lb.push(entry);
  lb.sort((x,y) => y.s - x.s || y.a - x.a || x.d - y.d);
  lb = lb.slice(0,50);
  localStorage.setItem('hsk_lb', JSON.stringify(lb));
  return {lb, rank: lb.indexOf(entry) + 1};
}

function renderDualLB(){
  const el = $('lbDual');
  const allLb = loadLB();
  
  const lb11 = allLb.filter(e => e.l === 11).sort((x,y) => y.s - x.s || y.a - x.a || x.d - y.d).slice(0,5);
  const lb12 = allLb.filter(e => e.l === 12).sort((x,y) => y.s - x.s || y.a - x.a || x.d - y.d).slice(0,5);
  
  el.classList.remove('hidden');
  
  let html = '';
  
  html += '<div class="lb-panel"><h3>Lesson 11 · Top 5</h3>';
  if(lb11.length === 0){
    html += '<div class="lb-note">No scores yet for Lesson 11.</div>';
  } else {
    lb11.forEach((e,i) => {
      const isMe = e.n === S.userName && e.d >= (Date.now() - 60000);
      html += lbRowHTML(e, i+1, isMe);
    });
  }
  html += '</div>';
  
  html += '<div class="lb-panel"><h3>Lesson 12 · Top 5</h3>';
  if(lb12.length === 0){
    html += '<div class="lb-note">No scores yet for Lesson 12.</div>';
  } else {
    lb12.forEach((e,i) => {
      const isMe = e.n === S.userName && e.d >= (Date.now() - 60000);
      html += lbRowHTML(e, i+1, isMe);
    });
  }
  html += '</div>';
  
  el.innerHTML = html;
}

function makeVocabQ(word, lesson){
  const info = DICT[word] || {p:'', e:''};
  const distractors = shuffle(lesson.vocab.filter(w => w !== word)).slice(0,3).map(w => (DICT[w]||{e:''}).e).filter(Boolean);
  const options = shuffle([info.e, ...distractors]);
  return {type:'vocab', word, o:options, a:options.indexOf(info.e), why:`${word} (${info.p}) means "${info.e}". Example: ${info.ex||''}`};
}
function buildQuestions(lesson){
  return {
    vocab: shuffle(lesson.vocab).slice(0,6).map(w => makeVocabQ(w, lesson)),
    cloze: lesson.cloze,
    order: lesson.order,
    reading: lesson.reading,
    build: lesson.build
  };
}

  show('quizScreen');
  updateHud();
  renderCurrent();
  if(S.timerEnabled) startTimer();
}
function retryLesson(){ startChallenge(); }

function startTimer(){
  pauseTimer();
  if(S.time <= 0){ endChallenge('time'); return; }
  S.timer = setInterval(() => {
    S.time -= 1;
    updateHud();
    if(S.time <= 0){ pauseTimer(); endChallenge('time'); }
  }, 1000);
}
function pauseTimer(){ if(S.timer){ clearInterval(S.timer); S.timer = null; } }

function renderCurrent(){
  if(!S.inChallenge) return;
  const qs = currentQuestions();
  if(S.qIndex >= qs.length){ nextMode(); return; }

  S.locked = false; S.orderSelected = []; S.buildPlaced = [];
  $('modeLabel').textContent = currentMode().zh + ' · ' + currentMode().en;
  $('qLabel').textContent = 'Q ' + (S.qIndex+1) + '/' + qs.length;
  $('feedback').className = 'feedback hidden';
  $('options').innerHTML = '';
  $('actionArea').innerHTML = '';

  const id = currentMode().id;
  if(id === 'vocab') renderVocab();
  if(id === 'cloze') renderCloze();
  if(id === 'order') renderOrder();
  if(id === 'reading') renderReading();
  if(id === 'build') renderBuild();

  updateHud();
}

function nextMode(){
  pauseTimer();
  const completed = MODES[S.modeIndex];
  S.modeIndex += 1; S.qIndex = 0;
  if(S.modeIndex >= MODES.length){ endChallenge('complete'); return; }
  const next = MODES[S.modeIndex];
  $('transText').textContent = completed.zh + ' 完成';
  $('transSub').textContent = 'Next: ' + next.zh + ' · ' + next.en;
  show('transitionScreen');
  setTimeout(() => { show('quizScreen'); renderCurrent(); if(S.timerEnabled) startTimer(); }, 1400);
}

function endChallenge(reason){
  pauseTimer();
  S.inChallenge = false;
  const acc = S.total ? Math.round((S.correct / S.total) * 100) : 0;

  $('resultTitle').textContent = reason === 'time' ? 'Time Up' : 'Challenge Complete';
  $('resultSub').textContent = reason === 'time'
    ? 'Timer reached zero. Try again!'
    : 'Lesson ' + S.lesson.id + ' · ' + S.lesson.title;

  $('resultStats').innerHTML = `
    <div class="stat"><div class="num">${S.correct}</div><div class="label">Correct</div></div>
    <div class="stat"><div class="num">${S.total}</div><div class="label">Total</div></div>
    <div class="stat"><div class="num">${acc}%</div><div class="label">Accuracy</div></div>
  `;

  const ma = $('mistakeArea');
  if(S.mistakes.length){
    ma.classList.remove('hidden');
    let html = '<h3>Review · 复习 (' + S.mistakes.length + ' missed)</h3>';
    S.mistakes.forEach((m, i) => {
      html += `
        <div class="mistake-item">
          <div class="mistake-mode-label">${m.mode || 'Question'} ${i+1}</div>
          <div class="mistake-question hanzi-text">${ruby(m.question || '')}</div>
          ${m.questionEn ? '<div class="mistake-question-en">' + m.questionEn + '</div>' : ''}
          <div class="mistake-answers">
            ${m.userAnswer ? '<span class="mistake-your-answer">Your answer: ' + m.userAnswer + '</span>' : ''}
            <span class="mistake-correct-answer">Correct: ${m.correctAnswer || ''}</span>
          </div>
          <div class="mistake-explanation">${m.why || ''}</div>
        </div>
      `;
    });
    ma.innerHTML = html;
  }else{
    ma.classList.add('hidden');
    ma.innerHTML = '';
  }

  const {lb, rank} = recordScore();

  show('resultScreen');
  updateHud();
}

function processAnswer(good, msg, mistakeData){
  S.locked = true;
  pauseTimer();
  if(good){ 
    S.correct += 1; 
    if(S.timerEnabled) S.time += 3; 
  }
  else if(mistakeData){ 
    S.mistakes.push(mistakeData); 
  }
  updateHud();

  const f = $('feedback');
  f.classList.remove('hidden');
  f.classList.add(good ? 'good' : 'bad');
  f.innerHTML = '<div class="verdict">' + (good ? 'Correct!' + (S.timerEnabled ? ' +3s' : '') : 'Not quite') + '</div><div>' + (msg || '') + '</div>';

  setTimeout(() => { S.qIndex += 1; renderCurrent(); if(S.timerEnabled) startTimer(); }, 1350);
}

function renderOptions(options, innerFn){
  const letters = ['A','B','C','D','E'];
  $('options').innerHTML = '';
  options.forEach((opt,i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="badge">' + letters[i] + '</span><div class="opt-content">' + innerFn(opt,i) + '</div>';
    b.onclick = () => pickMC(i);
    $('options').appendChild(b);
  });
}
function renderVocab(){
  const q = currentQ();
  const d = DICT[q.word] || {};
  $('questionArea').innerHTML = `
    <div class="q-sub">Choose the correct meaning.</div>
    <div class="q-prompt-hanzi hanzi">${ruby(q.word)}</div>
    <div class="pinyin-helper" style="text-align:center;margin-top:8px;">${d.p||''}</div>
  `;
  renderOptions(q.o, txt => '<span>' + txt + '</span>');
}
function renderCloze(){
  const q = currentQ();
  $('questionArea').innerHTML = `
    <div class="q-sub">Choose the best word.</div>
    <div class="q-text hanzi-text">${ruby(q.t).replace('______','<span class="blank">______</span>')}</div>
    ${q.tEn ? '<div class="q-sub" style="font-size:14px;margin-top:-8px;">' + q.tEn.replace('______','______') + '</div>' : ''}
  `;
  renderOptions(q.o, word => {
    const d = DICT[word] || {};
    return '<span class="option-hanzi">' + ruby(word) + '</span><span class="pinyin-helper">' + (d.p||'') + '</span><span class="english-helper">' + (d.e||'') + '</span>';
  });
}
function renderReading(){
  const q = currentQ();
  $('questionArea').innerHTML = `
    <div class="passage hanzi-text">${ruby(q.p)}</div>
    ${q.pEn ? '<div class="q-sub" style="font-size:14px;margin-top:-8px;">' + q.pEn + '</div>' : ''}
    <div class="q-text hanzi-text">${ruby(q.q)}</div>
    ${q.qEn ? '<div class="q-sub" style="font-size:14px;margin-top:-8px;">' + q.qEn + '</div>' : ''}
  `;
  renderOptions(q.o, txt => '<span class="option-hanzi">' + ruby(txt) + '</span>');
}
function pickMC(i){
  if(S.locked) return;
  const q = currentQ();
  const good = i === q.a;
  document.querySelectorAll('.opt').forEach((b,idx) => {
    b.disabled = true;
    if(idx === q.a) b.classList.add('correct');
    else if(idx === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const correctText = q.o[q.a];
  const label = q.word || q.q || q.t || 'Question';
  const modeName = currentMode().zh + ' · ' + currentMode().en;
  processAnswer(good, q.why || ('Correct: ' + correctText), 
    good ? null : {
      mode: modeName,
      question: q.t || q.q || (q.word ? 'What does "' + q.word + '" mean?' : ''),
      questionEn: q.tEn || q.qEn || (q.word ? 'What does "' + q.word + '" mean?' : ''),
      userAnswer: q.o[i],
      correctAnswer: correctText,
      why: q.why || ''
    }
  );
}

function renderOrder(){
  const q = currentQ();
  $('questionArea').innerHTML = `
    <div class="q-sub">Tap A/B/C in correct order.</div>
    <div class="order-parts">
      ${Object.entries(q.parts).map(([label,text]) => `
        <button class="order-part" id="order-${label}" onclick="toggleOrderPart('${label}')">
          <span class="badge">${label}</span>
          <span class="txt">${ruby(text)}</span>
        </button>
      `).join('')}
    </div>
    <div class="order-seq" id="orderSeq"></div>
  `;
  $('actionArea').innerHTML = '<button class="btn ghost small" onclick="resetOrder()">Reset</button>';
  updateOrderUI();
}
function toggleOrderPart(label){
  if(S.locked) return;
  const idx = S.orderSelected.indexOf(label);
  if(idx >= 0) S.orderSelected.splice(idx,1);
  else if(S.orderSelected.length < 3) S.orderSelected.push(label);
  updateOrderUI();
  if(S.orderSelected.length === 3) setTimeout(checkOrder, 260);
}
function resetOrder(){ if(S.locked) return; S.orderSelected = []; updateOrderUI(); }
function updateOrderUI(){
  ['A','B','C'].forEach(l => {
    const el = $('order-' + l);
    if(el) el.classList.toggle('selected', S.orderSelected.includes(l));
  });
  const seq = $('orderSeq');
  if(seq) seq.textContent = S.orderSelected.join(' ');
}
function checkOrder(){
  if(S.locked || S.orderSelected.length !== 3) return;
  const q = currentQ();
  const guess = S.orderSelected.join('');
  const good = guess === q.ans;
  const modeName = currentMode().zh + ' · ' + currentMode().en;
  const questionText = 'Order the sentences correctly';
  processAnswer(good, good ? q.why : ('Correct order: ' + q.ans), 
    good ? null : {
      mode: modeName,
      question: questionText,
      questionEn: questionText,
      userAnswer: guess,
      correctAnswer: q.ans,
      why: q.why || ''
    }
  );
}

function renderBuild(){
  $('questionArea').innerHTML = `
    <div class="q-sub">Tap words to build sentence.</div>
    <div class="build-answer" id="buildAnswer"></div>
    <div class="build-bank" id="buildBank"></div>
  `;
  $('actionArea').innerHTML = `
    <button class="btn small" id="checkBuild" onclick="checkBuild()" disabled>Check</button>
    <button class="btn ghost small" onclick="resetBuild()">Reset</button>
  `;
  renderBuildAreas();
}
function renderBuildAreas(){
  const q = currentQ();
  $('buildAnswer').innerHTML = S.buildPlaced.length
    ? S.buildPlaced.map((idx,pos) => '<button class="build-chip placed" onclick="clickBuildAnswer(' + pos + ')">' + ruby(q.words[idx]) + '</button>').join('')
    : '<span class="build-placeholder">Tap words below</span>';
  $('buildBank').innerHTML = q.words
    .map((w,i) => ({w,i}))
    .filter(it => !S.buildPlaced.includes(it.i))
    .map(it => '<button class="build-chip" onclick="clickBuildBank(' + it.i + ')">' + ruby(it.w) + '</button>')
    .join('');
  $('checkBuild').disabled = S.buildPlaced.length !== q.words.length;
}
function clickBuildBank(i){ if(S.locked) return; if(!S.buildPlaced.includes(i)){ S.buildPlaced.push(i); renderBuildAreas(); } }
function clickBuildAnswer(pos){ if(S.locked) return; S.buildPlaced.splice(pos,1); renderBuildAreas(); }
function resetBuild(){ if(S.locked) return; S.buildPlaced = []; renderBuildAreas(); }
function checkBuild(){
  if(S.locked) return;
  const q = currentQ();
  if(S.buildPlaced.length !== q.words.length) return;
  const good = JSON.stringify(S.buildPlaced) === JSON.stringify(q.ans);
  const userSentence = S.buildPlaced.map(i => q.words[i]).join('');
  const modeName = currentMode().zh + ' · ' + currentMode().en;
  processAnswer(good, good ? q.why : ('Correct: ' + q.target), 
    good ? null : {
      mode: modeName,
      question: 'Build the correct sentence',
      questionEn: 'Build the correct sentence',
      userAnswer: userSentence,
      correctAnswer: q.target,
      why: q.why || ''
    }
  );
}

(function init(){
  const savedName = localStorage.getItem('hsk_name');
  if(savedName){
    $('nameInput').value = savedName;
    S.userName = savedName;
  }
  S.py = localStorage.getItem('hsk_py') !== '0';
  S.en = localStorage.getItem('hsk_en') !== '0';
  S.timerEnabled = localStorage.getItem('hsk_timer') !== '0';
  $('timerToggle').classList.toggle('on', S.timerEnabled);
  applyToggles();
})();

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

  const SITE_ID = "Lester";

  const firebaseConfig = {
    apiKey: "AIzaSyAwq-xZ9eI8JS6DLGxQ3jGQa_-T1P_LquI",
    authDomain: "hsk-leaderboards.firebaseapp.com",
    projectId: "hsk-leaderboards",
    storageBucket: "hsk-leaderboards.firebasestorage.app",
    messagingSenderId: "133154223109",
    appId: "1:133154223109:web:891ab19e979d61bd58186c"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const localSaveScore = window.saveScore;
  const localRender = window.renderLeaderboard;

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  window.saveScore = async function (catKey, name, score, total, timeTaken) {
    try {
      await push(ref(db, "boards/" + SITE_ID + "_" + catKey + "/scores"), {
        name, score, total, timeTaken, date: new Date().toLocaleDateString()
      });
    } catch (e) { console.error("Upload failed, saving locally:", e); localSaveScore(catKey, name, score, total, timeTaken); }
    window.renderLeaderboard(catKey);
  };

  window.renderLeaderboard = async function (catKey) {
    const list = document.getElementById("leaderboard-list");
    if (!list) return;
    list.innerHTML = '<div style="text-align:center; color: var(--text-dim); padding: 15px;">Loading global leaderboard…</div>';
    try {
      const snap = await get(ref(db, "boards/" + SITE_ID + "_" + catKey + "/scores"));
      let entries = [];
      if (snap.exists()) snap.forEach(child => entries.push(child.val()));
      entries.sort((a, b) => (b.score - a.score) || (a.timeTaken - b.timeTaken));
      entries = entries.slice(0, 5);
      if (entries.length === 0) {
        list.innerHTML = '<div style="text-align:center; color: var(--text-dim); padding: 15px;">No scores yet. Be the first on the global board!</div>';
        return;
      }
      let html = '<table class="leaderboard-table"><thead><tr><th>Rank</th><th>Name</th><th>Score</th><th>Time</th></tr></thead><tbody>';
      entries.forEach((entry, index) => {
        const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
        html += `<tr>
          <td class="${rankClass}">#${index + 1}</td>
          <td style="font-weight: bold;">${escapeHtml(entry.name)}</td>
          <td>${entry.score}/${entry.total}</td>
          <td style="color: var(--text-dim);">${formatTime(entry.timeTaken)}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      list.innerHTML = html;
    } catch (e) { console.error("Leaderboard load failed:", e); localRender(catKey); }
  };
</script>
